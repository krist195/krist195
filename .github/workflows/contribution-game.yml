name: Generate contribution game

on:
  schedule:
    - cron: "15 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    name: Generate Breakout contribution graph
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Breakout game
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "breakout"

      - name: Publish game to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update contribution game"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
